[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-execution-finality-reference"
version = "0.1.0"
description = "Runnable reference implementation of digest-bound, consume-once payment execution finality"
requires-python = ">=3.10"
authors = [{name = "Sangam Das"}]

[project.scripts]
payment-finality-demo = "payment_finality.demo:main"
payment-finality-benchmark = "payment_finality.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

