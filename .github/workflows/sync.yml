name: Sync to Hugging Face
on:
  push:
    branches: [main] # Change this to master if your main branch is called master
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: sangamdas/Payment-Execution-Finality
          hf_token: ${{ secrets.HF_TOKEN }}
